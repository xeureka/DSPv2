<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">DispatchPilot system architecture</title>
  <desc id="desc">Users interact with a React dashboard and intake channels. A Hono API routes requests through deterministic safety, Gemini or fallback extraction, pure planning and SLA engines, PostgreSQL event storage, adapters, outbox notifications, and simulator workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#14532d" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#15803d"/>
    </marker>
    <style>
      .title { font: 700 28px ui-sans-serif, system-ui, sans-serif; fill: #123026 }
      .subtitle { font: 400 15px ui-sans-serif, system-ui, sans-serif; fill: #527066 }
      .group { font: 700 14px ui-sans-serif, system-ui, sans-serif; fill: #166534; letter-spacing: 1px }
      .box-title { font: 700 16px ui-sans-serif, system-ui, sans-serif; fill: #123026 }
      .box-copy { font: 400 13px ui-sans-serif, system-ui, sans-serif; fill: #36594b }
      .api-title { font: 700 17px ui-sans-serif, system-ui, sans-serif; fill: #fff }
      .api-copy { font: 400 13px ui-sans-serif, system-ui, sans-serif; fill: #dcfce7 }
      .line { fill: none; stroke: #15803d; stroke-width: 2.5; marker-end: url(#arrow) }
      .dash { fill: none; stroke: #65a30d; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow) }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="70" y="64" class="title">DispatchPilot system architecture</text>
  <text x="70" y="92" class="subtitle">Accountable field-service intake, planning, SLA control, and operational evidence</text>

  <text x="70" y="145" class="group">EXPERIENCE</text>
  <g filter="url(#shadow)">
    <rect x="70" y="165" width="250" height="125" rx="16" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="92" y="198" class="box-title">Staff dashboard</text>
    <text x="92" y="224" class="box-copy">React · Vite · TanStack</text>
    <text x="92" y="246" class="box-copy">Jobs · board · plans · contracts</text>
    <text x="92" y="268" class="box-copy">Approvals · simulator · SSE</text>
    <rect x="360" y="165" width="250" height="125" rx="16" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="382" y="198" class="box-title">Inbound channels</text>
    <text x="382" y="224" class="box-copy">Email or simulated inbox</text>
    <text x="382" y="246" class="box-copy">Chat and command bar</text>
    <text x="382" y="268" class="box-copy">Contract PDF upload</text>
    <rect x="650" y="165" width="250" height="125" rx="16" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="672" y="198" class="box-title">Authentication</text>
    <text x="672" y="224" class="box-copy">Better Auth cookie sessions</text>
    <text x="672" y="246" class="box-copy">Manager · dispatcher · technician</text>
    <text x="672" y="268" class="box-copy">Role-filtered access</text>
  </g>

  <text x="70" y="345" class="group">APPLICATION API · HONO / NODE.JS 24</text>
  <g filter="url(#shadow)">
    <rect x="70" y="365" width="830" height="210" rx="20" fill="url(#api)"/>
    <text x="100" y="405" class="api-title">DispatchPilot API</text>
    <text x="100" y="431" class="api-copy">Typed routes · Zod validation · shared response envelopes · OpenAPI</text>
    <rect x="100" y="458" width="220" height="82" rx="12" fill="#14532d" stroke="#4ade80"/>
    <text x="120" y="486" class="api-title" font-size="14">Intake and safety</text>
    <text x="120" y="509" class="api-copy">sanitize · scan · extract</text>
    <text x="120" y="527" class="api-copy">validate · route approval</text>
    <rect x="345" y="458" width="255" height="82" rx="12" fill="#14532d" stroke="#4ade80"/>
    <text x="365" y="486" class="api-title" font-size="14">Jobs, contracts, approvals</text>
    <text x="365" y="509" class="api-copy">workflow · SLA · evidence</text>
    <text x="365" y="527" class="api-copy">idempotent state changes</text>
    <rect x="625" y="458" width="245" height="82" rx="12" fill="#14532d" stroke="#4ade80"/>
    <text x="645" y="486" class="api-title" font-size="14">Plans and operations</text>
    <text x="645" y="509" class="api-copy">proposals · tick · outbox</text>
    <text x="645" y="527" class="api-copy">simulations · SSE stream</text>
  </g>

  <text x="960" y="345" class="group">LANGUAGE ADAPTERS</text>
  <g filter="url(#shadow)">
    <rect x="960" y="365" width="360" height="95" rx="16" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
    <text x="985" y="398" class="box-title">Gemini structured output</text>
    <text x="985" y="422" class="box-copy">Typed tools · cache · timeout · retries</text>
    <text x="985" y="443" class="box-copy">No database access or write tools</text>
    <rect x="960" y="480" width="360" height="95" rx="16" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="985" y="513" class="box-title">Rule-based fallback</text>
    <text x="985" y="537" class="box-copy">Equipment, skill, urgency, building lookup</text>
    <text x="985" y="558" class="box-copy">Low confidence routes to approval</text>
  </g>

  <text x="70" y="630" class="group">PURE DECISION ENGINES</text>
  <g filter="url(#shadow)">
    <rect x="70" y="650" width="250" height="120" rx="16" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="92" y="684" class="box-title">Planner</text>
    <text x="92" y="708" class="box-copy">Cheapest insertion + local search</text>
    <text x="92" y="730" class="box-copy">Skills · shifts · SLA · disruption</text>
    <text x="92" y="752" class="box-copy">Plan diff and cost breakdown</text>
    <rect x="360" y="650" width="250" height="120" rx="16" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="382" y="684" class="box-title">SLA and escalation</text>
    <text x="382" y="708" class="box-copy">Deadlines · thresholds · breaches</text>
    <text x="382" y="730" class="box-copy">Safety-critical acceleration</text>
    <text x="382" y="752" class="box-copy">Credit exposure</text>
    <rect x="650" y="650" width="250" height="120" rx="16" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="672" y="684" class="box-title">Simulator and learning</text>
    <text x="672" y="708" class="box-copy">Seeded baseline comparison</text>
    <text x="672" y="730" class="box-copy">Duration median and p90 stats</text>
    <text x="672" y="752" class="box-copy">Asset callback risk</text>
  </g>

  <text x="960" y="630" class="group">PERSISTENCE AND INTEGRATIONS</text>
  <g filter="url(#shadow)">
    <rect x="960" y="650" width="360" height="120" rx="16" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="985" y="684" class="box-title">PostgreSQL / Neon</text>
    <text x="985" y="708" class="box-copy">Jobs · assignments · contracts · assets</text>
    <text x="985" y="730" class="box-copy">Events · approvals · outbox · simulations</text>
    <text x="985" y="752" class="box-copy">Tracked Drizzle migrations</text>
  </g>

  <path d="M195 290V350" class="line"/>
  <path d="M485 290V350" class="line"/>
  <path d="M775 290V350" class="line"/>
  <path d="M900 430H950" class="line"/>
  <path d="M485 575V640" class="line"/>
  <path d="M775 575V640" class="line"/>
  <path d="M1020 575V640" class="line"/>
  <path d="M320 710H350" class="dash"/>
  <path d="M610 710H640" class="dash"/>
  <path d="M900 710H950" class="dash"/>
  <path d="M1140 460V640" class="dash"/>

  <text x="70" y="845" class="subtitle">Deterministic code owns safety, assignments, constraints, timers, and writes. AI handles language through typed, validated tools only.</text>
</svg>
